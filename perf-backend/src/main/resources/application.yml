spring:
  application:
    name: perf-backend

  mvc:
    problemdetails:
      enabled: true

  datasource:
    url: jdbc:h2:file:./data/perf
    driver-class-name: org.h2.Driver

  sql:
    init:
      mode: always

  h2:
    console:
      enabled: false
      path: /h2-console

server:
  port: 8080
