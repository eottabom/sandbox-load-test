plugins {
    id 'java'
    id 'maven-publish'
    alias(libs.plugins.gatling)
    alias(libs.plugins.shadow)
}

def versionProps = new Properties()
file("version.properties").withInputStream { versionProps.load(it) }

group   = 'io.github.eottabom'
version = versionProps.getProperty('version')

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(shared.versions.java.get())
    }
}

// Gatling 플러그인이 test 출력물을 gatling classpath에 포함하는 것을 꺼서 compileGatlingJava → testClasses 의존을 피할 수 있다.
gatling {
    includeTestOutput = false
}

configurations {
    testImplementation.extendsFrom(configurations.gatlingImplementation)
}

dependencies {

    // prometheus
    gatlingImplementation libs.bundles.prometheus

    // gatling output
    testImplementation sourceSets.gatling.output

    // JUnit
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly    libs.junit.platform.launcher

    // assertJ
    testImplementation libs.assertj.core

    // testcontainers
    testImplementation platform(libs.testcontainers.bom)
    testImplementation libs.testcontainers.core
    testImplementation libs.testcontainers.junit.jupiter

    // awaitility
    testImplementation libs.awaitility

    // slf4j
    testRuntimeOnly libs.slf4j.simple
}

// composite build(includeBuild)에서 gatling 소스셋 클래스를 찾을 수 있도록
// 기본 jar에 gatling 소스셋 출력을 포함시킨다.
jar {
    from sourceSets.gatling.output
}
jar.dependsOn(compileGatlingJava)

compileTestJava.dependsOn(compileGatlingJava)

test {
    useJUnitPlatform()
}

shadowJar {
    archiveBaseName.set('gatling-runner')
    archiveClassifier.set('')

    manifest {
        attributes 'Main-Class': 'io.github.eottabom.gatling.runner.GatlingRunner'
    }

    from sourceSets.gatling.output

    configurations = [project.configurations.gatlingRuntimeClasspath]

    mergeServiceFiles()

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

shadowJar.dependsOn(compileGatlingJava)

build.dependsOn shadowJar

publishing {
    publications {
        gatlingRunner(MavenPublication) {
            artifactId = 'gatling-runner'
            artifact(shadowJar) {
                classifier = ''
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/eottabom/sandbox-load-test')
            credentials {
                username = project.findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                password = project.findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
